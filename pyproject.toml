[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-schema-validator"
version = "0.1.0"
description = "Validate CSV files against a JSON schema of types, ranges, patterns and allowed values."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
csv-schema-validator = "csv_schema_validator.cli:main"

[tool.setuptools]
packages = ["csv_schema_validator"]
